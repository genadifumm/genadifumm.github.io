services:
  - type: web
    name: whatsapp-assistant
    runtime: docker
    rootDir: whatsapp-assistant
    plan: starter
    healthCheckPath: /health
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: WA_TOKEN
        sync: false
      - key: WA_PHONE_NUMBER_ID
        sync: false
      - key: WA_APP_SECRET
        sync: false
      - key: OWNER_PHONE
        sync: false
      - key: WA_VERIFY_TOKEN
        generateValue: true
      - key: DAILY_BRIEF_HOUR
        value: "8"
      - key: TIMEZONE
        value: Asia/Jerusalem
